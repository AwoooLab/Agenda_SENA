<section id="sesion" class="fragmento" data-screen="login" data-slot="login.form">
  <div class="fragmento-cabecera">
    <span class="etiqueta">Acceso</span>
    <h2>Iniciar sesión</h2>
    <p>El usuario registrado puede entrar a su agenda.</p>
  </div>
  <form id="form-login" class="tarjeta relleno" style="max-width:480px">
    <div class="campo">
      <label for="login-usuario">Usuario</label>
      <input id="login-usuario" placeholder="Tu nombre de usuario" />
    </div>
    <div class="campo">
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" placeholder="Tu contraseña" />
    </div>
    <button type="button" style="width:100%" data-action="login">Iniciar sesión</button>
    <p id="login-estado" class="estado-error oculto" aria-live="polite"></p>
    <p class="muted centrado">La contraseña no se muestra ni se guarda en texto plano.</p>
  </form>
</section>
