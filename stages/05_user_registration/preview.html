<section id="usuarios" class="fragmento" data-screen="login" data-slot="login.form">
  <div class="fragmento-cabecera">
    <span class="etiqueta">Usuarios</span>
    <h2>Crear una cuenta</h2>
    <p>Un usuario local podrá utilizar su propia agenda.</p>
  </div>
  <div class="rejilla rejilla-2">
    <form id="form-registro" class="tarjeta relleno">
      <div class="campo">
        <label for="registro-usuario">Nombre de usuario</label>
        <input id="registro-usuario" placeholder="Ejemplo: ana" />
      </div>
      <div class="campo">
        <label for="registro-correo">Correo electrónico</label>
        <input id="registro-correo" type="email" placeholder="ana@ejemplo.com" />
      </div>
      <button type="button" class="verde" data-action="register">Registrar usuario</button>
      <p id="registro-estado" class="estado-exito oculto" aria-live="polite"></p>
    </form>
    <div class="tarjeta relleno">
      <h3>Datos del usuario</h3>
      <p class="muted">El registro prepara la información necesaria para iniciar sesión en la aplicación local.</p>
      <span class="etiqueta verde">Formulario listo</span>
    </div>
  </div>
</section>
