<section id="nueva-cita" class="fragmento" data-screen="agenda" data-slot="agenda.appointments">
  <div class="fragmento-cabecera">
    <span class="etiqueta">Nueva cita</span>
    <h2>Crear una cita</h2>
    <p>Los datos de una cita se reúnen en un formulario antes de guardarlos.</p>
  </div>
  <form id="form-cita">
    <div class="campo">
      <label for="cita-titulo">Título</label>
      <input id="cita-titulo" name="titulo" placeholder="Ejemplo: Clase de Python" />
    </div>
    <div class="rejilla rejilla-2">
      <div class="campo">
        <label for="cita-fecha">Fecha</label>
        <input id="cita-fecha" name="fecha" type="date" value="2026-10-23" />
      </div>
      <div class="campo">
        <label for="cita-hora">Hora</label>
        <input id="cita-hora" name="hora" type="time" value="18:00" />
      </div>
    </div>
    <div class="campo">
      <label for="cita-descripcion">Descripción</label>
      <textarea id="cita-descripcion" name="descripcion" placeholder="Describe la actividad"></textarea>
    </div>
    <button type="button" data-action="add-appointment">Agregar cita</button>
    <p id="estado-cita" class="estado-exito oculto" aria-live="polite"></p>
  </form>
</section>
