<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ventanas visuales de Agenda SENA para PC." />
    <title>Agenda SENA</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; background: #eef2f7; font-family: Arial, Helvetica, sans-serif; }
      #screen {
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #screen > svg {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <main id="screen" aria-live="polite"></main>
    <script src="web/screen.js"></script>
  </body>
</html>
