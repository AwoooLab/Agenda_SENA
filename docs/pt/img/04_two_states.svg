<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Dos estados, una sola aplicación</title>
  <desc id="desc">Inicio de sesión y agenda principal conectados dentro del mismo espacio de aplicación.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1535"/>
      <stop offset="0.58" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101A3A"/>
      <stop offset="1" stop-color="#2455C7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .navy { fill: #122554; }
      .muted { fill: #60789F; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="70" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1630" cy="1050" r="360" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 964 C360 860 650 1055 1010 954 S1600 830 1920 920" fill="none" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(140 112)">
    <text x="0" y="0" class="display white bold" font-size="62">Dos estados, una sola aplicación</text>
    <rect x="0" y="46" width="720" height="5" rx="2.5" fill="#7DD3FC" opacity="0.75"/>
    <text x="0" y="130" class="sans white medium" font-size="38">La aplicación cambia de contenido dentro de la misma ventana.</text>
  </g>

  <!-- Etiquetas de los estados -->
  <g transform="translate(140 310)">
    <circle cx="12" cy="-8" r="8" fill="#7DD3FC"/>
    <text x="34" y="0" class="sans white bold" font-size="28">Estado 01 — Inicio de sesión</text>
  </g>
  <g transform="translate(1040 310)">
    <circle cx="12" cy="-8" r="8" fill="#39C875"/>
    <text x="34" y="0" class="sans white bold" font-size="28">Estado 02 — Agenda principal</text>
  </g>

  <!-- Estado 01: login -->
  <g transform="translate(140 350)" filter="url(#shadow)">
    <rect width="740" height="480" rx="26" fill="#F4F8FE" stroke="#A5D8FF" stroke-width="2"/>
    <rect x="26" y="26" width="688" height="428" rx="20" fill="#FFFFFF" stroke="#D6E3F3" stroke-width="2"/>
    <rect x="26" y="26" width="688" height="52" rx="20" fill="url(#bar)"/>
    <rect x="26" y="54" width="688" height="24" fill="url(#bar)"/>
    <circle cx="54" cy="52" r="6" fill="#FB5B5B"/>
    <circle cx="76" cy="52" r="6" fill="#F8B84E"/>
    <circle cx="98" cy="52" r="6" fill="#39C875"/>
    <text x="126" y="59" class="sans white bold" font-size="20">Agenda SENA</text>

    <circle cx="370" cy="144" r="34" fill="#E4EEFF"/>
    <image href="../../../assets/icons/lock.svg" x="350" y="124" width="40" height="40"/>
    <text x="370" y="216" text-anchor="middle" class="sans navy bold" font-size="31">Bienvenido</text>
    <text x="370" y="250" text-anchor="middle" class="sans muted" font-size="20">Ingresa para acceder a tu agenda</text>

    <text x="190" y="284" class="sans navy medium" font-size="17">Usuario</text>
    <rect x="190" y="296" width="360" height="38" rx="10" fill="#F7FAFE" stroke="#C9D8EB" stroke-width="2"/>
    <image href="../../../assets/icons/user.svg" x="204" y="303" width="24" height="24"/>
    <text x="238" y="321" class="sans muted" font-size="17">Escribe tu usuario</text>

    <text x="190" y="354" class="sans navy medium" font-size="17">Contraseña</text>
    <rect x="190" y="366" width="360" height="38" rx="10" fill="#F7FAFE" stroke="#C9D8EB" stroke-width="2"/>
    <image href="../../../assets/icons/lock.svg" x="204" y="373" width="24" height="24"/>
    <text x="238" y="391" class="sans muted" font-size="17">Escribe tu contraseña</text>
    <rect x="260" y="416" width="220" height="34" rx="10" fill="#2563EB"/>
    <text x="370" y="439" text-anchor="middle" class="sans white bold" font-size="18">Ingresar</text>
  </g>

  <!-- Estado 02: agenda principal -->
  <g transform="translate(1040 350)" filter="url(#shadow)">
    <rect width="740" height="480" rx="26" fill="#F4F8FE" stroke="#A5D8FF" stroke-width="2"/>
    <rect x="26" y="26" width="688" height="428" rx="20" fill="#FFFFFF" stroke="#D6E3F3" stroke-width="2"/>
    <rect x="26" y="26" width="688" height="52" rx="20" fill="url(#bar)"/>
    <rect x="26" y="54" width="688" height="24" fill="url(#bar)"/>
    <circle cx="54" cy="52" r="6" fill="#FB5B5B"/>
    <circle cx="76" cy="52" r="6" fill="#F8B84E"/>
    <circle cx="98" cy="52" r="6" fill="#39C875"/>
    <text x="126" y="59" class="sans white bold" font-size="20">Agenda SENA</text>

    <rect x="26" y="78" width="144" height="376" fill="#EEF5FF"/>
    <text x="50" y="120" class="sans navy bold" font-size="18">Menú</text>
    <rect x="46" y="142" width="104" height="34" rx="9" fill="#D7E7FF"/>
    <image href="../../../assets/icons/dashboard.svg" x="56" y="148" width="22" height="22"/>
    <text x="86" y="165" class="sans navy bold" font-size="15">Inicio</text>
    <image href="../../../assets/icons/calendar.svg" x="56" y="196" width="22" height="22"/>
    <text x="86" y="213" class="sans navy" font-size="15">Calendario</text>
    <image href="../../../assets/icons/appointments.svg" x="56" y="244" width="22" height="22"/>
    <text x="86" y="261" class="sans navy" font-size="15">Citas</text>
    <image href="../../../assets/icons/users.svg" x="56" y="292" width="22" height="22"/>
    <text x="86" y="309" class="sans navy" font-size="15">Usuarios</text>

    <text x="198" y="120" class="sans navy bold" font-size="25">Buenos días, Alejandro</text>
    <text x="198" y="148" class="sans muted" font-size="17">Resumen de tu agenda para hoy</text>
    <rect x="198" y="174" width="148" height="72" rx="12" fill="#EEF5FF"/>
    <text x="216" y="199" class="sans muted" font-size="14">Citas de hoy</text>
    <text x="216" y="230" class="sans navy bold" font-size="28">04</text>
    <rect x="362" y="174" width="148" height="72" rx="12" fill="#FFF4DE"/>
    <text x="380" y="199" class="sans muted" font-size="14">Pendientes</text>
    <text x="380" y="230" class="sans navy bold" font-size="28">08</text>
    <rect x="526" y="174" width="148" height="72" rx="12" fill="#EAFBF1"/>
    <text x="544" y="199" class="sans muted" font-size="14">Próxima cita</text>
    <text x="544" y="230" class="sans navy bold" font-size="28">10:00</text>

    <rect x="198" y="270" width="310" height="150" rx="14" fill="#FFFFFF" stroke="#DCE7F3"/>
    <image href="../../../assets/icons/calendar.svg" x="216" y="290" width="24" height="24"/>
    <text x="250" y="310" class="sans navy bold" font-size="18">Calendario mensual</text>
    <text x="216" y="340" class="sans muted" font-size="14">Octubre 2026</text>
    <g stroke="#E4EBF5" stroke-width="1">
      <line x1="216" y1="356" x2="490" y2="356"/><line x1="216" y1="382" x2="490" y2="382"/>
      <line x1="260" y1="348" x2="260" y2="408"/><line x1="304" y1="348" x2="304" y2="408"/><line x1="348" y1="348" x2="348" y2="408"/><line x1="392" y1="348" x2="392" y2="408"/><line x1="436" y1="348" x2="436" y2="408"/>
    </g>
    <rect x="306" y="360" width="28" height="14" rx="5" fill="#2563EB"/>
    <rect x="394" y="384" width="28" height="14" rx="5" fill="#16A34A"/>

    <rect x="526" y="270" width="148" height="150" rx="14" fill="#F8FBFF" stroke="#DCE7F3"/>
    <text x="544" y="298" class="sans navy bold" font-size="16">Agenda de hoy</text>
    <circle cx="546" cy="326" r="5" fill="#2563EB"/><text x="560" y="331" class="sans navy" font-size="13">09:00</text>
    <circle cx="546" cy="354" r="5" fill="#F97316"/><text x="560" y="359" class="sans navy" font-size="13">10:00</text>
    <circle cx="546" cy="382" r="5" fill="#16A34A"/><text x="560" y="387" class="sans navy" font-size="13">14:30</text>
  </g>

  <!-- Flujo de transición -->
  <g transform="translate(900 548)">
    <circle cx="60" cy="0" r="43" fill="#2563EB"/>
    <path d="M35 0 H81 M65 -18 L84 0 L65 18" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="82" text-anchor="middle" class="sans sky bold" font-size="22">Ingresar</text>
  </g>

  <text x="1810" y="1010" text-anchor="end" class="sans soft" font-size="18" opacity="0.75">04</text>
</svg>
