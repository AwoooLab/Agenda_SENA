<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">¿Qué problema estamos resolviendo?</title>
  <desc id="desc">Comparación entre información dispersa y una agenda organizada.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1535"/>
      <stop offset="0.58" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .muted { fill: #9CB6DD; }
      .navy { fill: #122554; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="80" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1620" cy="1030" r="360" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 970 C360 880 620 1060 1010 950 S1600 830 1920 920" fill="none" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(140 124)">
    <text x="0" y="0" class="display white bold" font-size="62">¿Qué problema estamos resolviendo?</text>
    <rect x="0" y="44" width="760" height="5" rx="2.5" fill="#7DD3FC" opacity="0.75"/>
    <text x="0" y="124" class="sans white medium" font-size="36">Organizar citas y actividades en un solo lugar,</text>
    <text x="0" y="174" class="sans white medium" font-size="36">con una aplicación sencilla, local y fácil de ampliar.</text>
  </g>

  <g transform="translate(120 356)">
    <rect width="700" height="420" rx="28" fill="url(#panel)" stroke="#FCA5A5" stroke-opacity="0.48" stroke-width="2"/>
    <text x="42" y="62" class="sans white bold" font-size="30">ANTES</text>
    <text x="42" y="98" class="sans soft" font-size="20">Información dispersa</text>

    <g filter="url(#noteShadow)" transform="translate(78 148) rotate(-7)">
      <rect width="190" height="116" rx="12" fill="#FFF7D6"/>
      <circle cx="26" cy="25" r="7" fill="#F59E0B"/>
      <text x="24" y="66" class="sans navy bold" font-size="22">Reunión</text>
      <text x="24" y="94" class="sans navy" font-size="18">23 oct · 10:00</text>
    </g>

    <g filter="url(#noteShadow)" transform="translate(272 246) rotate(6)">
      <rect width="190" height="116" rx="12" fill="#E0F2FE"/>
      <circle cx="26" cy="25" r="7" fill="#0284C7"/>
      <text x="24" y="66" class="sans navy bold" font-size="22">Entrega</text>
      <text x="24" y="94" class="sans navy" font-size="18">25 oct · 14:30</text>
    </g>

    <g filter="url(#noteShadow)" transform="translate(480 132) rotate(-4)">
      <rect width="170" height="112" rx="12" fill="#FCE7F3"/>
      <circle cx="25" cy="25" r="7" fill="#DB2777"/>
      <text x="24" y="65" class="sans navy bold" font-size="22">Llamar</text>
      <text x="24" y="92" class="sans navy" font-size="18">Sin fecha</text>
    </g>

    <path d="M72 333 C170 300 205 348 288 320 S445 300 520 332" fill="none" stroke="#FCA5A5" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="8 10"/>
    <text x="42" y="386" class="sans soft" font-size="19">Notas, mensajes y calendarios separados</text>
  </g>

  <g transform="translate(852 536)">
    <circle cx="108" cy="0" r="48" fill="#2563EB" opacity="0.95"/>
    <path d="M82 0 H128 M112 -18 L130 0 L112 18" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="88" text-anchor="middle" class="sans sky bold" font-size="20">Organizar la</text>
    <text x="108" y="116" text-anchor="middle" class="sans sky bold" font-size="20">información</text>
  </g>

  <g transform="translate(1080 356)">
    <rect width="720" height="420" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-opacity="0.75" stroke-width="2" filter="url(#shadow)"/>
    <text x="42" y="62" class="sans navy bold" font-size="30">DESPUÉS</text>
    <text x="42" y="98" class="sans" fill="#55709C" font-size="20">Agenda SENA organizada</text>

    <rect x="42" y="126" width="636" height="250" rx="18" fill="#FFFFFF" stroke="#D9E5F3" stroke-width="2"/>
    <rect x="42" y="126" width="636" height="48" rx="18" fill="#172B62"/>
    <rect x="42" y="152" width="636" height="22" fill="#172B62"/>
    <circle cx="68" cy="150" r="6" fill="#FB5B5B"/>
    <circle cx="88" cy="150" r="6" fill="#F8B84E"/>
    <circle cx="108" cy="150" r="6" fill="#39C875"/>
    <text x="134" y="157" class="sans white bold" font-size="17">Agenda SENA</text>

    <rect x="62" y="194" width="96" height="160" rx="10" fill="#EEF5FF"/>
    <rect x="78" y="216" width="64" height="9" rx="4.5" fill="#2563EB"/>
    <rect x="78" y="242" width="50" height="7" rx="3.5" fill="#91B7EE"/>
    <rect x="78" y="266" width="58" height="7" rx="3.5" fill="#91B7EE"/>
    <rect x="78" y="290" width="48" height="7" rx="3.5" fill="#91B7EE"/>
    <rect x="78" y="320" width="60" height="18" rx="9" fill="#D7E7FF"/>

    <rect x="180" y="194" width="270" height="160" rx="10" fill="#FFFFFF" stroke="#E2EAF5"/>
    <text x="198" y="220" class="sans navy bold" font-size="17">Octubre 2026</text>
    <line x1="198" y1="236" x2="432" y2="236" stroke="#DCE7F3" stroke-width="2"/>
    <g stroke="#E6EDF6" stroke-width="1">
      <line x1="198" y1="262" x2="432" y2="262"/><line x1="198" y1="290" x2="432" y2="290"/><line x1="198" y1="318" x2="432" y2="318"/>
      <line x1="237" y1="244" x2="237" y2="344"/><line x1="276" y1="244" x2="276" y2="344"/><line x1="315" y1="244" x2="315" y2="344"/><line x1="354" y1="244" x2="354" y2="344"/><line x1="393" y1="244" x2="393" y2="344"/>
    </g>
    <rect x="278" y="266" width="34" height="16" rx="5" fill="#2563EB"/>
    <rect x="356" y="294" width="34" height="16" rx="5" fill="#16A34A"/>
    <rect x="200" y="322" width="34" height="16" rx="5" fill="#F59E0B"/>

    <rect x="472" y="194" width="186" height="160" rx="10" fill="#F8FBFF" stroke="#E2EAF5"/>
    <text x="490" y="220" class="sans navy bold" font-size="16">Citas de hoy</text>
    <circle cx="493" cy="250" r="6" fill="#2563EB"/><text x="510" y="255" class="sans navy" font-size="14">09:00  Reunión</text>
    <circle cx="493" cy="282" r="6" fill="#F97316"/><text x="510" y="287" class="sans navy" font-size="14">10:00  Entrega</text>
    <circle cx="493" cy="314" r="6" fill="#16A34A"/><text x="510" y="319" class="sans navy" font-size="14">14:30  Llamar</text>

    <circle cx="622" cy="218" r="13" fill="#DCFCE7"/>
    <path d="M615 218 L620 223 L630 212" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="405" class="sans" fill="#55709C" font-size="19">Fechas, horas, usuarios, estados y categorías</text>
  </g>

  <g transform="translate(120 875)">
    <rect x="0" y="0" width="1680" height="1" fill="#7DD3FC" opacity="0.35"/>
    <g transform="translate(0 32)">
      <circle cx="8" cy="8" r="7" fill="#FCA5A5"/>
      <text x="28" y="17" class="sans soft" font-size="26">Las citas se dispersan en notas, mensajes o calendarios.</text>
    </g>
    <g transform="translate(900 32)">
      <circle cx="8" cy="8" r="7" fill="#FBBF24"/>
      <text x="28" y="17" class="sans soft" font-size="26">La información importante debe consultarse rápidamente.</text>
    </g>
    <g transform="translate(0 76)">
      <circle cx="8" cy="8" r="7" fill="#60A5FA"/>
      <text x="28" y="17" class="sans soft" font-size="26">Una agenda necesita fechas, horas, usuarios, estados y categorías.</text>
    </g>
    <g transform="translate(900 76)">
      <circle cx="8" cy="8" r="7" fill="#39C875"/>
      <text x="28" y="17" class="sans white medium" font-size="26">El proyecto convierte esa necesidad en una aplicación funcional.</text>
    </g>
  </g>

  <text x="1810" y="1010" text-anchor="end" class="sans soft" font-size="18" opacity="0.75">02</text>
</svg>
