        <rect x="24" y="251" width="82" height="52"/><rect x="110" y="251" width="82" height="52"/><rect x="196" y="251" width="82" height="52"/><rect x="282" y="251" width="82" height="52"/><rect x="368" y="251" width="82" height="52"/><rect x="454" y="251" width="82" height="52"/><rect x="540" y="251" width="82" height="52"/>
