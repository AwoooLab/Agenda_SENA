        <text x="40" y="283">8</text><text x="126" y="283" class="blue bold">9</text><text x="212" y="283">10</text><text x="298" y="283">11</text><text x="384" y="283">12</text><text x="470" y="283">13</text><text x="556" y="283">14</text>
