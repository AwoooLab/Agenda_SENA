      <stop offset="0" stop-color="#091735"/>
      <stop offset="0.56" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="appHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102456"/>
      <stop offset="1" stop-color="#20499D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
