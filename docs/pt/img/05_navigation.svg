<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Del acceso al cierre de sesión</title>
  <desc id="desc">Una ventana central de Agenda SENA acompañada por tres momentos de uso: acceso, trabajo diario y cierre.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1535"/>
      <stop offset="0.58" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="appBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101A3A"/>
      <stop offset="1" stop-color="#2455C7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .navy { fill: #122554; }
      .muted { fill: #60789F; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="70" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1660" cy="1040" r="370" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 970 C360 860 650 1055 1010 954 S1600 830 1920 920" fill="none" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(140 108)">
    <text x="0" y="0" class="display white bold" font-size="64">Del acceso al cierre de sesión</text>
    <rect x="0" y="46" width="620" height="5" rx="2.5" fill="#7DD3FC" opacity="0.75"/>
    <text x="0" y="128" class="sans white medium" font-size="38">La aplicación acompaña todo el trabajo del usuario dentro de una misma ventana.</text>
  </g>

  <!-- Conexiones entre los tres momentos y la ventana principal -->
  <path d="M390 486 C440 486 458 486 500 486" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M1420 486 C1475 486 1492 486 1530 486" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M960 850 C960 884 960 895 960 920" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <g fill="#7DD3FC">
    <path d="M500 486 l-15 -10 v20 z"/>
    <path d="M1530 486 l-15 -10 v20 z"/>
    <path d="M960 920 l-10 -15 h20 z"/>
  </g>

  <!-- Momento 01: acceso -->
  <g transform="translate(90 370)" filter="url(#softShadow)">
    <rect width="310" height="235" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="55" cy="54" r="25" fill="#DCEBFF"/>
    <text x="55" y="62" text-anchor="middle" class="sans navy bold" font-size="21">01</text>
    <text x="38" y="118" class="sans navy bold" font-size="31">Acceso</text>
    <line x1="38" y1="137" x2="270" y2="137" stroke="#D5E4F5" stroke-width="2"/>
    <image href="../../../assets/icons/lock.svg" x="38" y="157" width="30" height="30"/>
    <text x="82" y="180" class="sans navy bold" font-size="21">Abrir aplicación</text>
    <text x="82" y="207" class="sans muted" font-size="18">Iniciar sesión</text>
  </g>

  <!-- Momento 03: cierre -->
  <g transform="translate(1530 370)" filter="url(#softShadow)">
    <rect width="310" height="235" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="55" cy="54" r="25" fill="#FDE4E4"/>
    <text x="55" y="62" text-anchor="middle" class="sans navy bold" font-size="21">03</text>
    <text x="38" y="118" class="sans navy bold" font-size="31">Cierre</text>
    <line x1="38" y1="137" x2="270" y2="137" stroke="#D5E4F5" stroke-width="2"/>
    <image href="../../../assets/icons/logout.svg" x="38" y="157" width="30" height="30"/>
    <text x="82" y="180" class="sans navy bold" font-size="21">Cerrar sesión</text>
    <text x="82" y="207" class="sans muted" font-size="18">Regresar al acceso</text>
  </g>

  <!-- Ventana central de Agenda SENA -->
  <g transform="translate(500 305)" filter="url(#shadow)">
    <rect width="1030" height="545" rx="30" fill="#F8FBFF"/>
    <rect width="1030" height="72" rx="30" fill="url(#appBar)"/>
    <rect y="42" width="1030" height="30" fill="url(#appBar)"/>
    <circle cx="34" cy="36" r="8" fill="#FB5B5B"/>
    <circle cx="60" cy="36" r="8" fill="#F8B84E"/>
    <circle cx="86" cy="36" r="8" fill="#39C875"/>
    <text x="120" y="45" class="sans white bold" font-size="25">Agenda SENA</text>
    <rect x="610" y="19" width="220" height="35" rx="10" fill="#FFFFFF" fill-opacity="0.13"/>
    <image href="../../../assets/icons/search.svg" x="626" y="25" width="24" height="24"/>
    <text x="660" y="42" class="sans soft" font-size="15">Buscar en la agenda</text>
    <circle cx="918" cy="36" r="22" fill="#7DD3FC"/>
    <text x="918" y="43" text-anchor="middle" class="sans navy bold" font-size="15">AS</text>
    <text x="950" y="33" class="sans white bold" font-size="16">Alejandro</text>
    <text x="950" y="52" class="sans soft" font-size="13">Sesión activa</text>

    <rect y="72" width="190" height="473" fill="#EEF5FF"/>
    <text x="32" y="118" class="sans navy bold" font-size="21">Menú</text>
    <rect x="22" y="140" width="146" height="42" rx="11" fill="#D7E7FF"/>
    <image href="../../../assets/icons/dashboard.svg" x="36" y="150" width="22" height="22"/>
    <text x="70" y="168" class="sans navy bold" font-size="16">Inicio</text>
    <image href="../../../assets/icons/calendar.svg" x="36" y="208" width="22" height="22"/>
    <text x="70" y="226" class="sans navy" font-size="16">Calendario</text>
    <image href="../../../assets/icons/appointments.svg" x="36" y="266" width="22" height="22"/>
    <text x="70" y="284" class="sans navy" font-size="16">Citas</text>
    <image href="../../../assets/icons/activity.svg" x="36" y="324" width="22" height="22"/>
    <text x="70" y="342" class="sans navy" font-size="16">Actividades</text>
    <image href="../../../assets/icons/users.svg" x="36" y="382" width="22" height="22"/>
    <text x="70" y="400" class="sans navy" font-size="16">Usuarios</text>

    <text x="230" y="124" class="sans navy bold" font-size="30">Buenos días, Alejandro</text>
    <text x="230" y="154" class="sans muted" font-size="18">Resumen de tu agenda para hoy</text>

    <rect x="230" y="184" width="220" height="92" rx="16" fill="#EAF2FF"/>
    <text x="252" y="216" class="sans muted" font-size="16">Citas de hoy</text>
    <text x="252" y="255" class="sans navy bold" font-size="34">04</text>
    <text x="326" y="254" class="sans" fill="#16A34A" font-size="15">+2 esta semana</text>
    <circle cx="415" cy="230" r="22" fill="#D7E7FF"/>
    <image href="../../../assets/icons/calendar.svg" x="402" y="217" width="26" height="26"/>

    <rect x="470" y="184" width="220" height="92" rx="16" fill="#FFF4DE"/>
    <text x="492" y="216" class="sans muted" font-size="16">Pendientes</text>
    <text x="492" y="255" class="sans navy bold" font-size="34">08</text>
    <text x="566" y="254" class="sans" fill="#F97316" font-size="15">3 importantes</text>
    <circle cx="655" cy="230" r="22" fill="#FFE8B8"/>
    <image href="../../../assets/icons/check.svg" x="642" y="217" width="26" height="26"/>

    <rect x="710" y="184" width="274" height="92" rx="16" fill="#EAFBF1"/>
    <text x="732" y="216" class="sans muted" font-size="16">Próxima cita</text>
    <text x="732" y="255" class="sans navy bold" font-size="34">10:00</text>
    <text x="850" y="254" class="sans muted" font-size="16">Reunión</text>
    <circle cx="950" cy="230" r="22" fill="#D7F5E2"/>
    <image href="../../../assets/icons/clock.svg" x="937" y="217" width="26" height="26"/>

    <rect x="230" y="306" width="470" height="205" rx="18" fill="#FFFFFF" stroke="#DCE7F3" stroke-width="2"/>
    <image href="../../../assets/icons/calendar.svg" x="254" y="328" width="28" height="28"/>
    <text x="296" y="351" class="sans navy bold" font-size="22">Calendario mensual</text>
    <text x="254" y="382" class="sans muted" font-size="16">Octubre 2026</text>
    <line x1="254" y1="398" x2="674" y2="398" stroke="#DCE7F3" stroke-width="2"/>
    <g stroke="#E6EDF6" stroke-width="1">
      <line x1="254" y1="430" x2="674" y2="430"/><line x1="254" y1="462" x2="674" y2="462"/><line x1="254" y1="494" x2="674" y2="494"/>
      <line x1="314" y1="410" x2="314" y2="502"/><line x1="374" y1="410" x2="374" y2="502"/><line x1="434" y1="410" x2="434" y2="502"/><line x1="494" y1="410" x2="494" y2="502"/><line x1="554" y1="410" x2="554" y2="502"/><line x1="614" y1="410" x2="614" y2="502"/>
    </g>
    <rect x="378" y="432" width="42" height="18" rx="5" fill="#2563EB"/>
    <rect x="558" y="464" width="42" height="18" rx="5" fill="#16A34A"/>
    <rect x="438" y="480" width="42" height="18" rx="5" fill="#F59E0B"/>

    <rect x="720" y="306" width="264" height="205" rx="18" fill="#FFFFFF" stroke="#DCE7F3" stroke-width="2"/>
    <image href="../../../assets/icons/clock.svg" x="744" y="328" width="28" height="28"/>
    <text x="786" y="351" class="sans navy bold" font-size="22">Agenda de hoy</text>
    <line x1="744" y1="374" x2="960" y2="374" stroke="#DCE7F3" stroke-width="2"/>
    <circle cx="750" cy="408" r="7" fill="#2563EB"/><text x="770" y="414" class="sans navy" font-size="17">09:00  Plan de trabajo</text>
    <circle cx="750" cy="448" r="7" fill="#F97316"/><text x="770" y="454" class="sans navy" font-size="17">10:00  Reunión</text>
    <circle cx="750" cy="488" r="7" fill="#16A34A"/><text x="770" y="494" class="sans navy" font-size="17">14:30  Entrega</text>
  </g>

  <!-- Momento 02: trabajo diario -->
  <g transform="translate(515 910)" filter="url(#softShadow)">
    <rect width="890" height="92" rx="24" fill="#FFFFFF" fill-opacity="0.95" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="55" cy="46" r="25" fill="#DCEBFF"/>
    <text x="55" y="54" text-anchor="middle" class="sans navy bold" font-size="21">02</text>
    <text x="100" y="40" class="sans navy bold" font-size="27">Trabajo diario</text>
    <text x="100" y="69" class="sans muted" font-size="18">Ver agenda · navegar por el menú · gestionar citas y actividades</text>
  </g>

  <text x="1810" y="1010" text-anchor="end" class="sans soft" font-size="18" opacity="0.75">05</text>
</svg>
