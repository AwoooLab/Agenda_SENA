<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">¿Cómo se navega en la aplicación?</title>
  <desc id="desc">Ruta visual de seis pasos para navegar por Agenda SENA.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1535"/>
      <stop offset="0.58" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .navy { fill: #122554; }
      .muted { fill: #60789F; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="70" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1650" cy="1040" r="370" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 970 C360 860 650 1055 1010 954 S1600 830 1920 920" fill="none" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(140 112)">
    <text x="0" y="0" class="display white bold" font-size="64">¿Cómo se navega en la aplicación?</text>
    <rect x="0" y="46" width="700" height="5" rx="2.5" fill="#7DD3FC" opacity="0.75"/>
    <text x="0" y="130" class="sans white medium" font-size="38">El usuario recorre la agenda desde el acceso hasta el cierre de sesión.</text>
  </g>

  <text x="960" y="296" text-anchor="middle" class="sans sky bold" font-size="24" letter-spacing="1.4">RECORRIDO PRINCIPAL</text>

  <!-- Ruta serpenteante de seis pasos -->
  <g fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M620 450 H710"/>
    <path d="M1210 450 H1300"/>
    <path d="M1550 570 V660"/>
    <path d="M1300 770 H1210"/>
    <path d="M710 770 H620"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M710 450 l-18 -12 v24 z"/>
    <path d="M1300 450 l-18 -12 v24 z"/>
    <path d="M1550 660 l-12 -18 h24 z"/>
    <path d="M1210 770 l18 -12 v24 z"/>
    <path d="M620 770 l18 -12 v24 z"/>
  </g>

  <!-- Paso 01 -->
  <g transform="translate(120 340)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="48" cy="45" r="22" fill="#DCEBFF"/>
    <text x="48" y="52" text-anchor="middle" class="sans navy bold" font-size="18">01</text>
    <circle cx="78" cy="126" r="38" fill="#E4EEFF"/>
    <image href="../../../assets/icons/dashboard.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans navy bold" font-size="35">Abrir aplicación</text>
    <text x="140" y="158" class="sans muted" font-size="23">Abrir el programa.</text>
  </g>

  <!-- Paso 02 -->
  <g transform="translate(710 340)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="48" cy="45" r="22" fill="#DCEBFF"/>
    <text x="48" y="52" text-anchor="middle" class="sans navy bold" font-size="18">02</text>
    <circle cx="78" cy="126" r="38" fill="#E4EEFF"/>
    <image href="../../../assets/icons/lock.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans navy bold" font-size="35">Iniciar sesión</text>
    <text x="140" y="158" class="sans muted" font-size="23">Acceder con usuario y contraseña.</text>
  </g>

  <!-- Paso 03 -->
  <g transform="translate(1300 340)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#2563EB" stroke="#A5D8FF" stroke-width="3"/>
    <circle cx="48" cy="45" r="22" fill="#FFFFFF" fill-opacity="0.22"/>
    <text x="48" y="52" text-anchor="middle" class="sans white bold" font-size="18">03</text>
    <circle cx="78" cy="126" r="38" fill="#FFFFFF" fill-opacity="0.18"/>
    <image href="../../../assets/icons/calendar.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans white bold" font-size="35">Ver agenda</text>
    <text x="140" y="158" class="sans soft" font-size="23">Consultar la información del día.</text>
  </g>

  <!-- Paso 04 -->
  <g transform="translate(1300 660)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="48" cy="45" r="22" fill="#DCEBFF"/>
    <text x="48" y="52" text-anchor="middle" class="sans navy bold" font-size="18">04</text>
    <circle cx="78" cy="126" r="38" fill="#E4EEFF"/>
    <image href="../../../assets/icons/dashboard.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans navy bold" font-size="35">Navegar por el menú</text>
    <text x="140" y="158" class="sans muted" font-size="23">Cambiar de sección.</text>
  </g>

  <!-- Paso 05 -->
  <g transform="translate(710 660)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="48" cy="45" r="22" fill="#FFF0CC"/>
    <text x="48" y="52" text-anchor="middle" class="sans navy bold" font-size="18">05</text>
    <circle cx="78" cy="126" r="38" fill="#FFF3D9"/>
    <image href="../../../assets/icons/appointments.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans navy bold" font-size="35">Gestionar citas</text>
    <text x="140" y="158" class="sans muted" font-size="23">Crear y revisar actividades.</text>
  </g>

  <!-- Paso 06 -->
  <g transform="translate(120 660)" filter="url(#shadow)">
    <rect width="500" height="220" rx="28" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <circle cx="48" cy="45" r="22" fill="#FDE4E4"/>
    <text x="48" y="52" text-anchor="middle" class="sans navy bold" font-size="18">06</text>
    <circle cx="78" cy="126" r="38" fill="#FDE8E8"/>
    <image href="../../../assets/icons/logout.svg" x="54" y="102" width="48" height="48"/>
    <text x="140" y="118" class="sans navy bold" font-size="35">Cerrar sesión</text>
    <text x="140" y="158" class="sans muted" font-size="23">Regresar al inicio de sesión.</text>
  </g>

  <g transform="translate(140 946)">
    <circle cx="14" cy="0" r="9" fill="#7DD3FC"/>
    <text x="38" y="8" class="sans soft" font-size="24">Al cerrar sesión, el recorrido vuelve al inicio.</text>
  </g>

  <text x="1810" y="1010" text-anchor="end" class="sans soft" font-size="18" opacity="0.75">05</text>
</svg>
