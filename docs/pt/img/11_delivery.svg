<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Stage 10 — Validar, proteger y entregar</title>
  <desc id="desc">La aplicaci&#243;n pasa por tres comprobaciones y se convierte en el ejecutable AgendaSENA.exe listo para entregar.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091735"/>
      <stop offset="0.56" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="package" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16377D"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .navy { fill: #102456; }
      .muted { fill: #587095; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .blue { fill: #2563EB; }
      .green { fill: #16A34A; }
      .orange { fill: #F97316; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
      text[font-size="13"], text[font-size="14"], text[font-size="15"], text[font-size="16"], text[font-size="17"], text[font-size="18"], text[font-size="19"], text[font-size="20"], text[font-size="21"] { font-size: 22px !important; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="45" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1680" cy="1080" r="380" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 982 C350 875 670 1040 1040 950 S1610 850 1920 940" fill="none" stroke="#7DD3FC" stroke-opacity="0.13" stroke-width="2"/>

  <g transform="translate(120 105)">
    <text x="0" y="0" class="display white bold" font-size="63">Stage 10 &#8212; Validar, proteger y entregar</text>
    <rect x="0" y="48" width="720" height="5" rx="2.5" fill="#7DD3FC" opacity="0.78"/>
    <text x="0" y="125" class="sans white medium" font-size="35">La entrega debe funcionar, poder probarse y poder explicarse.</text>
    <text x="0" y="185" class="sans sky bold" font-size="24" letter-spacing="3">C&#211;DIGO &#8594; VALIDACI&#211;N &#8594; AGENDA SENA</text>
  </g>

  <g transform="translate(100 265)" filter="url(#shadow)">
    <rect width="1720" height="650" rx="30" fill="#F5F8FD"/>
    <rect width="1720" height="72" rx="30" fill="#102456"/>
    <rect y="44" width="1720" height="28" fill="#102456"/>
    <circle cx="38" cy="36" r="9" fill="#FF5F57"/>
    <circle cx="68" cy="36" r="9" fill="#FEBC2E"/>
    <circle cx="98" cy="36" r="9" fill="#28C840"/>
    <text x="140" y="46" class="sans white bold" font-size="28">Agenda SENA / salida del proyecto</text>
    <text x="1470" y="46" class="sans soft medium" font-size="24">STAGE 10</text>

    <!-- Validation block -->
    <g transform="translate(55 112)" filter="url(#softShadow)">
      <rect width="685" height="465" rx="24" fill="#FFFFFF" stroke="#D8E2F0" stroke-width="2"/>
      <rect width="685" height="12" rx="6" fill="#16A34A"/>
      <text x="34" y="58" class="sans green bold" font-size="24" letter-spacing="2">PUERTA DE SALIDA</text>
      <text x="34" y="105" class="sans navy bold" font-size="36">Validaci&#243;n final</text>
      <text x="34" y="143" class="sans muted medium" font-size="25">Tres comprobaciones antes de entregar.</text>

      <g transform="translate(28 174)">
        <rect width="629" height="78" rx="16" fill="#F3FAF5" stroke="#BFE7C9" stroke-width="2"/>
        <circle cx="42" cy="39" r="18" fill="#16A34A"/>
        <path d="M33 39l7 7 12-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="35" class="sans navy bold" font-size="29">Base de datos</text>
        <text x="78" y="61" class="sans muted" font-size="24">SQLite y registros disponibles</text>
      </g>
      <g transform="translate(28 265)">
        <rect width="629" height="78" rx="16" fill="#F3FAF5" stroke="#BFE7C9" stroke-width="2"/>
        <circle cx="42" cy="39" r="18" fill="#16A34A"/>
        <path d="M33 39l7 7 12-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="35" class="sans navy bold" font-size="29">Login</text>
        <text x="78" y="61" class="sans muted" font-size="24">El usuario puede entrar</text>
      </g>
      <g transform="translate(28 356)">
        <rect width="629" height="78" rx="16" fill="#F3FAF5" stroke="#BFE7C9" stroke-width="2"/>
        <circle cx="42" cy="39" r="18" fill="#16A34A"/>
        <path d="M33 39l7 7 12-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="35" class="sans navy bold" font-size="29">Actividades</text>
        <text x="78" y="61" class="sans muted" font-size="24">Crear, guardar y consultar</text>
      </g>
    </g>

    <!-- Security and transition -->
    <g transform="translate(740 290)">
      <path d="M0 0H275" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
      <path d="M275 0l-22-16v32z" fill="#2563EB"/>
      <text x="138" y="-28" text-anchor="middle" class="sans blue bold" font-size="25">aprobado</text>
      <g transform="translate(85 75) scale(1.10)">
        <path d="M48 0l42 17v38c0 34-21 59-42 72C27 114 6 89 6 55V17z" fill="#E6EEFF" stroke="#2563EB" stroke-width="4"/>
        <path d="M28 61l14 14 27-31" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="138" y="250" text-anchor="middle" class="sans navy bold" font-size="27">Seguridad</text>
      <text x="138" y="280" text-anchor="middle" class="sans muted medium" font-size="24">Datos locales</text>
      <text x="138" y="309" text-anchor="middle" class="sans muted medium" font-size="24">protegidos</text>
    </g>

    <!-- Executable package -->
    <g transform="translate(1015 112)" filter="url(#softShadow)">
      <rect width="650" height="465" rx="24" fill="url(#package)"/>
      <rect width="650" height="12" rx="6" fill="#7DD3FC"/>
      <text x="38" y="58" class="sans sky bold" font-size="26" letter-spacing="2">ENTREGA PARA WINDOWS</text>
      <text x="38" y="112" class="sans white bold" font-size="46">AgendaSENA.exe</text>
      <text x="38" y="151" class="sans soft medium" font-size="27">Aplicaci&#243;n local lista para abrir.</text>

      <g transform="translate(45 188)">
        <rect width="190" height="170" rx="22" fill="#FFFFFF" fill-opacity="0.14" stroke="#A9C9FF" stroke-opacity="0.50" stroke-width="2"/>
        <rect x="34" y="33" width="122" height="88" rx="10" fill="#DCEBFF"/>
        <rect x="34" y="33" width="122" height="20" rx="10" fill="#2563EB"/>
        <circle cx="47" cy="43" r="4" fill="#FF5F57"/><circle cx="60" cy="43" r="4" fill="#FEBC2E"/><circle cx="73" cy="43" r="4" fill="#28C840"/>
        <rect x="49" y="67" width="42" height="10" rx="5" fill="#2563EB"/>
        <rect x="49" y="87" width="86" height="9" rx="4.5" fill="#A9C9FF"/>
        <text x="95" y="151" text-anchor="middle" class="sans white bold" font-size="24">Agenda SENA</text>
      </g>

      <g transform="translate(275 188)">
        <circle cx="66" cy="76" r="66" fill="#FFFFFF" fill-opacity="0.12" stroke="#A9C9FF" stroke-opacity="0.45" stroke-width="2"/>
        <path d="M34 54h64v49H34z" fill="none" stroke="#FFFFFF" stroke-width="5"/>
        <path d="M45 54V42h42v12M54 72h24M54 87h24" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
        <text x="66" y="176" text-anchor="middle" class="sans white bold" font-size="25">.exe</text>
      </g>

      <rect x="430" y="211" width="170" height="54" rx="27" fill="#FFFFFF"/>
      <text x="478" y="245" class="sans blue bold" font-size="29">Abrir</text>
      <path d="M557 238h18M567 228l10 10-10 10" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="275" y="389" width="325" height="52" rx="26" fill="#C8F2D5"/>
      <circle cx="307" cy="415" r="14" fill="#16A34A"/>
      <path d="M300 415l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="335" y="424" class="sans green bold" font-size="27">Listo para entregar</text>
    </g>
  </g>

  <g transform="translate(120 960)">
    <circle cx="12" cy="12" r="8" fill="#7DD3FC"/>
    <text x="38" y="22" class="sans white bold" font-size="30">La aplicación funciona, puede probarse y puede explicarse.</text>
  </g>

  <text x="1810" y="1045" text-anchor="end" class="sans soft" font-size="22" opacity="0.75">11</text>
</svg>
