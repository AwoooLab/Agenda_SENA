<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Metodología por stages</title>
  <desc id="desc">Ciclo de trabajo para construir, probar e integrar cada módulo del proyecto.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1535"/>
      <stop offset="0.58" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#A9C9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity="0.20"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .navy { fill: #122554; }
      .muted { fill: #60789F; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
      text[font-size="13"], text[font-size="14"], text[font-size="15"], text[font-size="16"], text[font-size="17"], text[font-size="18"], text[font-size="19"], text[font-size="20"], text[font-size="21"] { font-size: 22px !important; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1700" cy="65" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1650" cy="1050" r="370" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 965 C360 860 650 1055 1010 954 S1600 830 1920 920" fill="none" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(120 112)">
    <text x="0" y="0" class="display white bold" font-size="64">Metodolog&#237;a por stages</text>
    <rect x="0" y="46" width="620" height="5" rx="2.5" fill="#7DD3FC" opacity="0.75"/>
    <text x="0" y="126" class="sans white medium" font-size="36">Cada stage construye una parte concreta y puede revisarse de forma independiente.</text>
    <text x="0" y="190" class="sans sky bold" font-size="22" letter-spacing="3">CICLO DE CONSTRUCCI&#211;N</text>
  </g>

  <!-- Flechas del recorrido principal -->
  <g fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M400 472 H440"/>
    <path d="M740 472 H780"/>
    <path d="M1080 472 H1120"/>
    <path d="M1270 615 C1270 770 250 770 250 615" stroke-dasharray="12 12"/>
  </g>
  <g fill="#7DD3FC">
    <path d="M440 472 l-15 -10 v20 z"/>
    <path d="M780 472 l-15 -10 v20 z"/>
    <path d="M1120 472 l-15 -10 v20 z"/>
    <path d="M250 615 l-12 18 h24 z"/>
  </g>
  <text x="760" y="805" text-anchor="middle" class="sans sky bold" font-size="24">Nueva funci&#243;n</text>

  <!-- Paso 01 -->
  <g transform="translate(100 330)" filter="url(#softShadow)">
    <rect width="300" height="285" rx="24" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <rect width="8" height="285" rx="4" fill="#2563EB"/>
    <circle cx="52" cy="55" r="28" fill="#E4EEFF"/>
    <text x="52" y="63" text-anchor="middle" class="sans navy bold" font-size="21">01</text>
    <g transform="translate(108 32)" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round">
      <path d="M3 2h22l9 9v36H3z" fill="#EAF2FF"/>
      <path d="M25 2v10h9M9 25h18M9 35h18"/>
    </g>
    <text x="28" y="124" class="sans navy bold" font-size="25">Leer la</text>
    <text x="28" y="154" class="sans navy bold" font-size="25">especificaci&#243;n</text>
    <text x="28" y="205" class="sans muted" font-size="22">Identificar archivos,</text>
    <text x="28" y="237" class="sans muted" font-size="22">requisitos y resultado.</text>
  </g>

  <!-- Paso 02 -->
  <g transform="translate(440 330)" filter="url(#softShadow)">
    <rect width="300" height="285" rx="24" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <rect width="8" height="285" rx="4" fill="#0EA5E9"/>
    <circle cx="52" cy="55" r="28" fill="#E0F2FE"/>
    <text x="52" y="63" text-anchor="middle" class="sans navy bold" font-size="21">02</text>
    <g transform="translate(108 34)" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12l-9 10 9 10M30 12l9 10-9 10M25 5L13 39"/>
    </g>
    <text x="28" y="124" class="sans navy bold" font-size="25">Crear el</text>
    <text x="28" y="154" class="sans navy bold" font-size="25">m&#243;dulo</text>
    <text x="28" y="205" class="sans muted" font-size="22">Trabajar dentro del</text>
    <text x="28" y="237" class="sans muted" font-size="22">stage correspondiente.</text>
  </g>

  <!-- Paso 03 -->
  <g transform="translate(780 330)" filter="url(#softShadow)">
    <rect width="300" height="285" rx="24" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <rect width="8" height="285" rx="4" fill="#F59E0B"/>
    <circle cx="52" cy="55" r="28" fill="#FFF3D9"/>
    <text x="52" y="63" text-anchor="middle" class="sans navy bold" font-size="21">03</text>
    <g transform="translate(106 38)" fill="none" stroke="#F59E0B" stroke-width="3">
      <path d="M2 21c8-15 28-15 36 0-8 15-28 15-36 0z" fill="#FFF8E8"/>
      <circle cx="20" cy="21" r="7" fill="#F59E0B"/>
    </g>
    <text x="28" y="124" class="sans navy bold" font-size="25">Probar el</text>
    <text x="28" y="154" class="sans navy bold" font-size="25">resultado</text>
    <text x="28" y="205" class="sans muted" font-size="22">Ejecutar Python y revisar</text>
    <text x="28" y="237" class="sans muted" font-size="22">preview.html.</text>
  </g>

  <!-- Paso 04 -->
  <g transform="translate(1120 330)" filter="url(#softShadow)">
    <rect width="300" height="285" rx="24" fill="#F8FBFF" stroke="#A5D8FF" stroke-width="2"/>
    <rect width="8" height="285" rx="4" fill="#16A34A"/>
    <circle cx="52" cy="55" r="28" fill="#E2F8EA"/>
    <text x="52" y="63" text-anchor="middle" class="sans navy bold" font-size="21">04</text>
    <g transform="translate(106 36)" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round">
      <circle cx="10" cy="20" r="9" fill="#EAFBF1"/>
      <circle cx="32" cy="20" r="9" fill="#EAFBF1"/>
      <path d="M17 20h8M5 39h32"/>
    </g>
    <text x="28" y="124" class="sans navy bold" font-size="25">Integrar la</text>
    <text x="28" y="154" class="sans navy bold" font-size="25">funci&#243;n</text>
    <text x="28" y="205" class="sans muted" font-size="22">Conectar el m&#243;dulo</text>
    <text x="28" y="237" class="sans muted" font-size="22">aprobado al programa.</text>
  </g>

  <!-- Carpeta de trabajo -->
  <g transform="translate(1460 330)" filter="url(#shadow)">
    <path d="M0 48V28c0-13 10-23 23-23h102l28 28h247c13 0 23 10 23 23v242c0 13-10 23-23 23H23c-13 0-23-10-23-23z" fill="url(#folder)" stroke="#A5D8FF" stroke-width="2"/>
    <path d="M0 52h423v246H0z" fill="#F8FBFF" opacity="0.94"/>
    <text x="30" y="102" class="sans navy bold" font-size="34">stages/</text>
    <text x="30" y="133" class="sans muted" font-size="22">Espacio de trabajo</text>
    <g transform="translate(30 160)">
      <rect width="363" height="48" rx="12" fill="#EAF2FF" stroke="#C9DCF7" stroke-width="2"/>
      <rect x="18" y="13" width="22" height="22" rx="4" fill="#2563EB"/>
      <text x="58" y="32" class="sans navy bold" font-size="24">app.py</text>
    </g>
    <g transform="translate(30 218)">
      <rect width="363" height="48" rx="12" fill="#F0EAFE" stroke="#D8C9F7" stroke-width="2"/>
      <rect x="18" y="13" width="22" height="22" rx="4" fill="#8B5CF6"/>
      <text x="58" y="32" class="sans navy bold" font-size="24">files.md</text>
    </g>
    <g transform="translate(30 276)">
      <rect width="363" height="48" rx="12" fill="#E2F8EA" stroke="#BEE7CA" stroke-width="2"/>
      <rect x="18" y="13" width="22" height="22" rx="4" fill="#16A34A"/>
      <text x="58" y="32" class="sans navy bold" font-size="24">preview.html</text>
    </g>
  </g>

  <!-- Frase de cierre -->
  <g transform="translate(120 900)" filter="url(#softShadow)">
    <rect width="1680" height="92" rx="22" fill="#DCEBFF" fill-opacity="0.96" stroke="#7DD3FC" stroke-width="2"/>
    <circle cx="48" cy="46" r="24" fill="#2563EB"/>
    <path d="M38 46h20M51 38l9 8-9 8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="55" class="sans navy bold" font-size="27">Independiente durante la construcci&#243;n; acumulativo durante la integraci&#243;n.</text>
  </g>

  <text x="1810" y="1035" text-anchor="end" class="sans soft" font-size="22" opacity="0.75">07</text>
</svg>
