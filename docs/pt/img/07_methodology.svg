<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">C&#243;mo se construye cada stage</title>
  <desc id="desc">Un espacio de trabajo muestra la relaci&#243;n entre la especificaci&#243;n, el m&#243;dulo de Python, la prueba visual y la integraci&#243;n.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091735"/>
      <stop offset="0.56" stop-color="#142B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0B1535"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .display { font-family: "Aptos Display", "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif; }
      .white { fill: #FFFFFF; }
      .navy { fill: #102456; }
      .deep { fill: #091735; }
      .muted { fill: #587095; }
      .soft { fill: #D8E7FF; }
      .sky { fill: #7DD3FC; }
      .blue { fill: #2563EB; }
      .green { fill: #16A34A; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
      text[font-size="13"], text[font-size="14"], text[font-size="15"], text[font-size="16"], text[font-size="17"], text[font-size="18"], text[font-size="19"], text[font-size="20"], text[font-size="21"] { font-size: 22px !important; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1710" cy="40" r="260" fill="#60A5FA" opacity="0.08"/>
  <circle cx="1700" cy="1080" r="390" fill="#93C5FD" opacity="0.05"/>
  <path d="M0 982 C330 875 680 1040 1030 950 S1600 850 1920 940" fill="none" stroke="#7DD3FC" stroke-opacity="0.13" stroke-width="2"/>

  <g transform="translate(120 110)">
    <text x="0" y="0" class="display white bold" font-size="64">C&#243;mo se construye cada stage</text>
    <rect x="0" y="48" width="710" height="5" rx="2.5" fill="#7DD3FC" opacity="0.78"/>
    <text x="0" y="128" class="sans white medium" font-size="36">Aislado durante la construcci&#243;n; integrado al finalizar.</text>
    <text x="0" y="190" class="sans sky bold" font-size="24" letter-spacing="3">ESPACIO DE TRABAJO DEL ESTUDIANTE</text>
  </g>

  <g transform="translate(1550 104)">
    <rect width="250" height="62" rx="31" fill="#DCEBFF" fill-opacity="0.16" stroke="#7DD3FC" stroke-width="2"/>
    <path d="M35 24h24v23H35zM35 24l12-10 12 10" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linejoin="round"/>
    <text x="78" y="40" class="sans white bold" font-size="27">stages/</text>
  </g>

  <!-- Workspace: the student sees the three files in one continuous flow. -->
  <g transform="translate(100 280)" filter="url(#shadow)">
    <rect width="1720" height="600" rx="30" fill="#F5F8FD"/>
    <rect width="1720" height="78" rx="30" fill="#102456"/>
    <rect y="48" width="1720" height="30" fill="#102456"/>
    <circle cx="38" cy="39" r="9" fill="#FF5F57"/>
    <circle cx="68" cy="39" r="9" fill="#FEBC2E"/>
    <circle cx="98" cy="39" r="9" fill="#28C840"/>
    <text x="140" y="49" class="sans white bold" font-size="28">Agenda SENA / stages / 01_python_window</text>
    <text x="1555" y="49" class="sans soft medium" font-size="24">3 archivos</text>

    <!-- Column 01 -->
    <g transform="translate(45 112)" filter="url(#softShadow)">
      <rect width="490" height="410" rx="22" fill="#FFFFFF" stroke="#D6E1F0" stroke-width="2"/>
      <rect width="490" height="12" rx="6" fill="#8B5CF6"/>
      <text x="30" y="58" class="sans sky bold" font-size="23" letter-spacing="2">01  LEER</text>
      <text x="30" y="105" class="sans navy bold" font-size="34">files.md</text>
      <text x="30" y="143" class="sans muted medium" font-size="25">La especificaci&#243;n define el trabajo.</text>
      <rect x="30" y="174" width="430" height="192" rx="14" fill="#F7F3FF" stroke="#DDD0FA" stroke-width="2"/>
      <text x="55" y="211" class="sans navy bold" font-size="24">REQUISITOS</text>
      <circle cx="59" cy="248" r="6" fill="#8B5CF6"/>
      <text x="80" y="256" class="sans navy medium" font-size="24">Archivo y responsabilidad</text>
      <circle cx="59" cy="290" r="6" fill="#8B5CF6"/>
      <text x="80" y="298" class="sans navy medium" font-size="24">Resultado que debe verse</text>
      <circle cx="59" cy="332" r="6" fill="#8B5CF6"/>
      <text x="80" y="340" class="sans navy medium" font-size="24">Forma de comprobarlo</text>
    </g>

    <!-- Arrow 01 to 02 -->
    <g transform="translate(555 300)">
      <path d="M0 0H58" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
      <path d="M58 0l-18-13v26z" fill="#2563EB"/>
    </g>

    <!-- Column 02 -->
    <g transform="translate(615 112)" filter="url(#softShadow)">
      <rect width="490" height="410" rx="22" fill="#FFFFFF" stroke="#D6E1F0" stroke-width="2"/>
      <rect width="490" height="12" rx="6" fill="#0EA5E9"/>
      <text x="30" y="58" class="sans sky bold" font-size="23" letter-spacing="2">02  CREAR</text>
      <text x="30" y="105" class="sans navy bold" font-size="34">app.py</text>
      <text x="30" y="143" class="sans muted medium" font-size="25">El m&#243;dulo resuelve un solo objetivo.</text>
      <rect x="30" y="174" width="430" height="192" rx="14" fill="url(#editor)"/>
      <circle cx="55" cy="200" r="6" fill="#FF5F57"/>
      <circle cx="76" cy="200" r="6" fill="#FEBC2E"/>
      <circle cx="97" cy="200" r="6" fill="#28C840"/>
      <text x="55" y="241" class="sans" fill="#7DD3FC" font-size="24">def main():</text>
      <text x="55" y="275" class="sans" fill="#F8FAFC" font-size="24">    crear_ventana()</text>
      <text x="55" y="309" class="sans" fill="#86EFAC" font-size="24">    mostrar_resultado()</text>
      <text x="55" y="343" class="sans" fill="#CBD5E1" font-size="24">if __name__ == "__main__":</text>
    </g>

    <!-- Arrow 02 to 03 -->
    <g transform="translate(1125 300)">
      <path d="M0 0H58" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
      <path d="M58 0l-18-13v26z" fill="#2563EB"/>
    </g>

    <!-- Column 03 -->
    <g transform="translate(1185 112)" filter="url(#softShadow)">
      <rect width="490" height="410" rx="22" fill="#FFFFFF" stroke="#D6E1F0" stroke-width="2"/>
      <rect width="490" height="12" rx="6" fill="#16A34A"/>
      <text x="30" y="58" class="sans sky bold" font-size="23" letter-spacing="2">03  PROBAR</text>
      <text x="30" y="105" class="sans navy bold" font-size="34">preview.html</text>
      <text x="30" y="143" class="sans muted medium" font-size="25">La salida se revisa en la misma vista.</text>
      <rect x="30" y="174" width="430" height="192" rx="14" fill="#F3FAF5" stroke="#BFE7C9" stroke-width="2"/>
      <rect x="30" y="174" width="430" height="38" rx="14" fill="#E3F5E8"/>
      <circle cx="54" cy="193" r="6" fill="#FF5F57"/>
      <circle cx="75" cy="193" r="6" fill="#FEBC2E"/>
      <circle cx="96" cy="193" r="6" fill="#28C840"/>
      <rect x="58" y="237" width="176" height="20" rx="10" fill="#D9E8FF"/>
      <rect x="58" y="273" width="350" height="15" rx="7.5" fill="#DCE7F3"/>
      <rect x="58" y="302" width="278" height="15" rx="7.5" fill="#DCE7F3"/>
      <rect x="58" y="336" width="172" height="27" rx="13.5" fill="#C8F2D5"/>
      <path d="M78 349l8 8 16-18" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="115" y="357" class="sans green bold" font-size="23">Resultado visible</text>
    </g>

    <text x="860" y="560" text-anchor="middle" class="sans muted medium" font-size="25">Cada archivo tiene una funci&#243;n clara y puede probarse antes de integrarse.</text>
  </g>

  <!-- Integration is a separate, obvious final action. -->
  <g transform="translate(100 910)" filter="url(#softShadow)">
    <rect width="1720" height="94" rx="24" fill="#DCEBFF" stroke="#7DD3FC" stroke-width="2"/>
    <rect width="255" height="94" rx="24" fill="#2563EB"/>
    <text x="32" y="39" class="sans white bold" font-size="24" letter-spacing="2">04  INTEGRAR</text>
    <text x="32" y="70" class="sans white medium" font-size="23">Listo para integrar</text>
    <text x="305" y="59" class="sans navy bold" font-size="31">m&#243;dulo aprobado</text>
    <path d="M620 47h74" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M694 47l-16-12v24z" fill="#2563EB"/>
    <text x="745" y="59" class="sans navy bold" font-size="31">main.py</text>
    <path d="M925 47h74" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M999 47l-16-12v24z" fill="#2563EB"/>
    <text x="1050" y="59" class="sans navy bold" font-size="31">aplicaci&#243;n completa</text>
  </g>

  <text x="1810" y="1045" text-anchor="end" class="sans soft" font-size="22" opacity="0.75">07</text>
</svg>
