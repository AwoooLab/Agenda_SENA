      <text x="22" y="35" class="sans muted" font-size="16">Citas de hoy</text>
      <text x="22" y="82" class="sans azul bold" font-size="36">04</text>
      <circle cx="218" cy="56" r="22" fill="#dbeafe"/><text x="218" y="64" text-anchor="middle" class="sans blue bold" font-size="24">✓</text>
    </g>
    <g transform="translate(280 112)">
      <rect width="260" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
