      <rect x="390" y="24" width="54" height="32" rx="7" fill="#dbeafe"/><text x="417" y="46" text-anchor="middle" class="sans azul bold" font-size="19">‹</text>
      <rect x="450" y="24" width="54" height="32" rx="7" fill="#dbeafe"/><text x="477" y="46" text-anchor="middle" class="sans azul bold" font-size="19">›</text>
      <line x1="24" y1="92" x2="496" y2="92" class="line"/>
      <g class="sans muted small">
        <text x="42" y="122">Lun</text><text x="110" y="122">Mar</text><text x="180" y="122">Mié</text><text x="250" y="122">Jue</text><text x="320" y="122">Vie</text><text x="390" y="122">Sáb</text><text x="455" y="122">Dom</text>
      </g>
      <g class="sans azul" font-size="15">
        <rect x="24" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="92" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="160" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="228" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="296" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="364" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="432" y="140" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="38" y="164">1</text><text x="106" y="164">2</text><text x="174" y="164">3</text><text x="242" y="164">4</text><text x="310" y="164">5</text><text x="378" y="164">6</text><text x="446" y="164">7</text>
        <rect x="24" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="92" y="198" width="66" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="160" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="228" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="296" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="364" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="432" y="198" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="38" y="222">8</text><text x="106" y="222" class="bold">9</text><text x="174" y="222">10</text><text x="242" y="222">11</text><text x="310" y="222">12</text><text x="378" y="222">13</text><text x="446" y="222">14</text>
        <rect x="24" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="92" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="160" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="228" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="296" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="364" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="432" y="256" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="38" y="280">15</text><text x="106" y="280">16</text><text x="174" y="280">17</text><text x="242" y="280">18</text><text x="310" y="280">19</text><text x="378" y="280">20</text><text x="446" y="280">21</text>
        <rect x="24" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="92" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="160" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="228" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="296" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="364" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/><rect x="432" y="314" width="66" height="54" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="38" y="338">22</text><text x="106" y="338">23</text><text x="174" y="338">24</text><text x="242" y="338">25</text><text x="310" y="338">26</text><text x="378" y="338">27</text><text x="446" y="338">28</text>
      </g>
