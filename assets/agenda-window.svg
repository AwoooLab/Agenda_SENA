<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ventana principal de Agenda SENA</title>
  <desc id="desc">Diseño editable de la ventana principal con menú, resumen, calendario, citas, usuarios y actividades.</desc>
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172554" flood-opacity="0.16"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .azul { fill: #172554; }
      .blue { fill: #2563eb; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .bold { font-weight: 700; }
      .small { font-size: 14px; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#eef2f7"/>
  <rect x="48" y="38" width="1504" height="924" rx="18" fill="#ffffff" filter="url(#sombra)"/>

  <rect x="48" y="38" width="1504" height="76" rx="18" fill="#172554"/>
  <rect x="48" y="82" width="1504" height="32" fill="#172554"/>
  <circle cx="82" cy="76" r="8" fill="#ef4444"/>
  <circle cx="108" cy="76" r="8" fill="#f59e0b"/>
  <circle cx="134" cy="76" r="8" fill="#22c55e"/>
  <text x="170" y="84" class="sans white bold" font-size="25">Agenda SENA</text>
  <text x="1450" y="84" text-anchor="end" class="sans" fill="#dbeafe" font-size="19">Mi agenda local para PC</text>

  <rect x="48" y="114" width="260" height="848" fill="#eff6ff"/>
  <line x1="308" y1="114" x2="308" y2="962" class="line"/>
  <text x="84" y="170" class="sans azul bold" font-size="22">Menú</text>

  <rect x="76" y="198" width="204" height="52" rx="9" fill="#dbeafe"/>
  <text x="98" y="232" class="sans azul bold" font-size="20">Inicio</text>
  <text x="98" y="288" class="sans azul" font-size="20">Nueva cita</text>
  <text x="98" y="344" class="sans azul" font-size="20">Citas</text>
  <text x="98" y="400" class="sans azul" font-size="20">Usuarios</text>
  <text x="98" y="456" class="sans azul" font-size="20">Calendario</text>
  <text x="98" y="512" class="sans azul" font-size="20">Actividades</text>
  <line x1="76" y1="550" x2="280" y2="550" class="line"/>
  <text x="98" y="594" class="sans muted" font-size="15">Sesión activa</text>
  <text x="98" y="622" class="sans azul bold" font-size="18">Usuario SENA</text>
  <rect x="76" y="864" width="204" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="178" y="892" text-anchor="middle" class="sans azul bold" font-size="16">Cerrar sesión</text>

  <rect x="308" y="114" width="1244" height="848" fill="#f8fafc"/>
  <g transform="translate(348 150)">
    <text x="0" y="42" class="sans azul bold" font-size="34">Inicio</text>
    <text x="0" y="78" class="sans muted" font-size="19">Resumen de tu agenda y próximas actividades.</text>

    <g transform="translate(0 112)">
