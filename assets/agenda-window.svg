<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ventana principal vacía de Agenda SENA</title>
  <desc id="desc">Ventana principal con espacios marcados para incorporar calendario, citas, usuarios y actividades.</desc>
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172554" flood-opacity="0.16"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .azul { fill: #172554; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .bold { font-weight: 700; }
      .small { font-size: 14px; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
      .espacio { fill: #f8fbff; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 8 7; }
      .etiqueta-espacio { fill: #2563eb; font-weight: 700; font-size: 16px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#eef2f7"/>
  <rect x="48" y="38" width="1504" height="924" rx="18" fill="#ffffff" filter="url(#sombra)"/>

  <rect x="48" y="38" width="1504" height="76" rx="18" fill="#172554"/>
  <rect x="48" y="82" width="1504" height="32" fill="#172554"/>
  <circle cx="82" cy="76" r="8" fill="#ef4444"/>
  <circle cx="108" cy="76" r="8" fill="#f59e0b"/>
  <circle cx="134" cy="76" r="8" fill="#22c55e"/>
  <text x="170" y="84" class="sans white bold" font-size="25">Agenda SENA</text>
  <text x="1450" y="84" text-anchor="end" class="sans" fill="#dbeafe" font-size="19">Mi agenda local para PC</text>

  <rect x="48" y="114" width="260" height="848" fill="#eff6ff"/>
  <line x1="308" y1="114" x2="308" y2="962" class="line"/>
  <text x="84" y="170" class="sans azul bold" font-size="22">Menú</text>

  <rect x="76" y="198" width="204" height="52" rx="9" fill="#dbeafe"/>
  <text x="98" y="232" class="sans azul bold" font-size="20">Inicio</text>
  <text x="98" y="288" class="sans azul" font-size="20">Nueva cita</text>
  <text x="98" y="344" class="sans azul" font-size="20">Citas</text>
  <text x="98" y="400" class="sans azul" font-size="20">Usuarios</text>
  <text x="98" y="456" class="sans azul" font-size="20">Calendario</text>
  <text x="98" y="512" class="sans azul" font-size="20">Actividades</text>
  <line x1="76" y1="550" x2="280" y2="550" class="line"/>
  <text x="98" y="594" class="sans muted" font-size="15">Sesión activa</text>
  <text x="98" y="622" class="sans azul bold" font-size="18">Usuario SENA</text>
  <rect x="76" y="864" width="204" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="178" y="892" text-anchor="middle" class="sans azul bold" font-size="16">Cerrar sesión</text>

  <rect x="308" y="114" width="1244" height="848" fill="#f8fafc"/>
  <g transform="translate(348 150)">
    <text x="0" y="42" class="sans azul bold" font-size="34">Inicio</text>
    <text x="0" y="78" class="sans muted" font-size="19">La ventana está preparada para incorporar las funciones de la agenda.</text>

    <g transform="translate(0 112)">
      <rect class="espacio" width="260" height="112" rx="12"/>
      <text x="130" y="50" text-anchor="middle" class="sans etiqueta-espacio">Resumen 1</text>
      <text x="130" y="78" text-anchor="middle" class="sans muted small">Espacio para indicador</text>
    </g>
    <g transform="translate(280 112)">
      <rect class="espacio" width="260" height="112" rx="12"/>
      <text x="130" y="50" text-anchor="middle" class="sans etiqueta-espacio">Resumen 2</text>
      <text x="130" y="78" text-anchor="middle" class="sans muted small">Espacio para indicador</text>
    </g>
    <g transform="translate(560 112)">
      <rect class="espacio" width="260" height="112" rx="12"/>
      <text x="130" y="50" text-anchor="middle" class="sans etiqueta-espacio">Resumen 3</text>
      <text x="130" y="78" text-anchor="middle" class="sans muted small">Espacio para indicador</text>
    </g>

    <g transform="translate(0 260)">
      <rect width="520" height="398" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="24" y="42" class="sans azul bold" font-size="22">Calendario mensual</text>
      <text x="24" y="72" class="sans muted" font-size="16">Aquí se ubicará la vista del calendario.</text>
      <rect x="24" y="102" width="472" height="264" rx="12" class="espacio"/>
      <text x="260" y="220" text-anchor="middle" class="sans etiqueta-espacio">Espacio para calendario</text>
      <text x="260" y="250" text-anchor="middle" class="sans muted small">Días, navegación de meses y eventos</text>
    </g>

    <g transform="translate(550 260)">
      <rect width="270" height="398" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="42" class="sans azul bold" font-size="22">Próximas citas</text>
      <text x="22" y="72" class="sans muted" font-size="16">Aquí aparecerán las citas.</text>
      <rect x="22" y="102" width="226" height="264" rx="12" class="espacio"/>
      <text x="135" y="220" text-anchor="middle" class="sans etiqueta-espacio">Espacio para citas</text>
      <text x="135" y="250" text-anchor="middle" class="sans muted small">Lista de próximas citas</text>
    </g>

    <g transform="translate(0 682)">
      <rect class="espacio" width="820" height="108" rx="12"/>
      <text x="410" y="48" text-anchor="middle" class="sans etiqueta-espacio">Espacio para tabla de citas</text>
      <text x="410" y="76" text-anchor="middle" class="sans muted small">Título, fecha, hora, descripción, estado y acciones</text>
    </g>
  </g>
</svg>
