      <text x="22" y="82" class="sans azul bold" font-size="36">08</text>
      <circle cx="218" cy="56" r="22" fill="#fef3c7"/><text x="218" y="64" text-anchor="middle" fill="#d97706" class="sans bold" font-size="24">!</text>
