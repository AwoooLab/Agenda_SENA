      <text x="22" y="78" class="sans muted" font-size="16">Hoy y los siguientes días</text>
      <line x1="22" y1="98" x2="248" y2="98" class="line"/>
      <rect x="22" y="122" width="226" height="70" rx="9" fill="#eff6ff"/>
      <text x="36" y="150" class="sans azul bold" font-size="16">Reunión de proyecto</text><text x="36" y="177" class="sans muted" font-size="14">Hoy · 10:00 a. m.</text>
      <rect x="22" y="208" width="226" height="70" rx="9" fill="#f8fafc"/>
      <text x="36" y="236" class="sans azul bold" font-size="16">Entregar actividad</text><text x="36" y="263" class="sans muted" font-size="14">Mañana · 3:00 p. m.</text>
      <rect x="22" y="294" width="226" height="70" rx="9" fill="#f8fafc"/>
      <text x="36" y="322" class="sans azul bold" font-size="16">Clase de Python</text><text x="36" y="349" class="sans muted" font-size="14">Viernes · 6:00 p. m.</text>
