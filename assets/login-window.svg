<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Inicio de sesión de Agenda SENA</title>
  <desc id="desc">Estado inicial de bienvenida y acceso de Agenda SENA para la Etapa 01; los campos reales se agregarán después.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d4a"/>
      <stop offset="0.55" stop-color="#173b8f"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
    <filter id="sombra-suave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .navy { fill: #111d4a; }
      .blue { fill: #2563eb; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .bold { font-weight: 700; }
      .soft { fill: #e8eef8; }
      .login-action { cursor: pointer; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#fondo)"/>
  <rect x="80" y="50" width="1280" height="800" rx="26" fill="#ffffff" filter="url(#sombra)"/>

  <rect x="80" y="50" width="1280" height="64" rx="26" fill="#111d4a"/>
  <rect x="80" y="88" width="1280" height="26" fill="#111d4a"/>
  <circle cx="116" cy="82" r="7" fill="#fb5b5b"/>
  <circle cx="140" cy="82" r="7" fill="#f8b84e"/>
  <circle cx="164" cy="82" r="7" fill="#39c875"/>
  <text x="196" y="89" class="sans" fill="#c9d7f5" font-size="17">Agenda SENA</text>
  <text x="1320" y="89" text-anchor="end" class="sans" fill="#9fb3df" font-size="15">Aplicación local para PC</text>

  <rect x="80" y="114" width="460" height="736" fill="url(#marca)"/>
  <circle cx="120" cy="230" r="210" fill="#ffffff" opacity="0.035"/>
  <circle cx="470" cy="720" r="250" fill="#7dd3fc" opacity="0.08"/>
  <path d="M80 670 C210 570 335 700 540 590 L540 850 L80 850 Z" fill="#0b173d" opacity="0.20"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <path d="M110 170h350M110 200h350M110 230h350M110 260h350"/>
    <path d="M140 145v170M180 145v170M220 145v170M260 145v170M300 145v170M340 145v170M380 145v170M420 145v170"/>
  </g>

  <rect x="132" y="196" width="58" height="58" rx="16" fill="#ffffff" opacity="0.16"/>
  <circle cx="161" cy="225" r="14" fill="#ffffff"/>
  <path d="M143 244c5-11 31-11 36 0" fill="#ffffff"/>
  <text x="132" y="330" class="sans white bold" font-size="44">Agenda SENA</text>
  <text x="132" y="374" class="sans" fill="#dbeafe" font-size="21">Organiza tu tiempo.</text>
  <text x="132" y="406" class="sans" fill="#dbeafe" font-size="21">Cumple tus objetivos.</text>
  <text x="132" y="470" class="sans" fill="#bcd1f4" font-size="17">Una agenda local para administrar</text>
  <text x="132" y="497" class="sans" fill="#bcd1f4" font-size="17">citas, actividades y compromisos.</text>

  <g transform="translate(132 590)">
    <circle cx="14" cy="14" r="14" fill="#60a5fa"/>
    <path d="M8 14l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="20" class="sans" fill="#e0ebff" font-size="17">Información organizada</text>
    <circle cx="14" cy="62" r="14" fill="#60a5fa"/>
    <path d="M8 62l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="68" class="sans" fill="#e0ebff" font-size="17">Seguimiento de actividades</text>
    <circle cx="14" cy="110" r="14" fill="#60a5fa"/>
    <path d="M8 110l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="116" class="sans" fill="#e0ebff" font-size="17">Todo en una sola ventana</text>
  </g>

  <rect x="540" y="114" width="820" height="736" fill="#f8fafc"/>
  <g transform="translate(714 194)">
    <rect width="520" height="500" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#sombra-suave)"/>
    <rect x="42" y="42" width="54" height="54" rx="16" fill="#e8f0ff"/>
    <image href="assets/icons/dashboard.svg" x="57" y="57" width="24" height="24"/>
    <text x="42" y="154" class="sans navy bold" font-size="31">Bienvenido a Agenda SENA</text>
    <text x="42" y="194" class="sans muted" font-size="17">Tu agenda local para PC, organizada en una sola ventana.</text>
    <text x="42" y="224" class="sans muted" font-size="17">En la siguiente vista encontrarás el espacio de trabajo.</text>

    <g transform="translate(42 276)">
      <circle cx="14" cy="14" r="14" fill="#e8f0ff"/>
      <image href="assets/icons/dashboard.svg" x="3" y="3" width="22" height="22"/>
      <text x="40" y="20" class="sans navy" font-size="16">Menú y resumen de la agenda</text>
      <circle cx="14" cy="58" r="14" fill="#e6fbf1"/>
      <image href="assets/icons/calendar.svg" x="3" y="47" width="22" height="22"/>
      <text x="40" y="64" class="sans navy" font-size="16">Calendario y citas de ejemplo</text>
      <circle cx="14" cy="102" r="14" fill="#f1eafe"/>
      <image href="assets/icons/activity.svg" x="3" y="91" width="22" height="22"/>
      <text x="40" y="108" class="sans navy" font-size="16">Actividades, colores e indicadores</text>
    </g>

    <g class="login-action" data-action="next-agenda" role="button" tabindex="0" aria-label="Siguiente">
      <rect x="42" y="410" width="436" height="58" rx="10" fill="#2563eb"/>
      <text x="260" y="447" text-anchor="middle" class="sans white bold" font-size="18">Siguiente</text>
    </g>
  </g>
</svg>
