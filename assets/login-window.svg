<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ventana de inicio de sesión de Agenda SENA</title>
  <desc id="desc">Diseño editable de la ventana independiente de inicio de sesión para Agenda SENA.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#172554" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .azul { fill: #172554; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#fondo)"/>
  <rect x="160" y="90" width="1120" height="720" rx="18" fill="#ffffff" filter="url(#sombra)"/>
  <rect x="160" y="90" width="1120" height="58" rx="18" fill="#172554"/>
  <rect x="160" y="122" width="1120" height="26" fill="#172554"/>
  <circle cx="190" cy="119" r="7" fill="#ef4444"/>
  <circle cx="214" cy="119" r="7" fill="#f59e0b"/>
  <circle cx="238" cy="119" r="7" fill="#22c55e"/>
  <text x="270" y="126" class="sans" fill="#dbeafe" font-size="18">Agenda SENA</text>

  <rect x="160" y="148" width="440" height="662" fill="#eff6ff"/>
  <line x1="600" y1="148" x2="600" y2="810" stroke="#e2e8f0" stroke-width="2"/>
  <text x="250" y="300" class="sans bold" font-size="52" fill="#172554">Agenda</text>
  <text x="250" y="360" class="sans bold" font-size="52" fill="#2563eb">SENA</text>
  <text x="250" y="410" class="sans muted" font-size="22">Organiza tus citas, actividades</text>
  <text x="250" y="443" class="sans muted" font-size="22">y compromisos desde un solo lugar.</text>
  <rect x="250" y="505" width="190" height="8" rx="4" fill="#2563eb"/>
  <rect x="250" y="533" width="265" height="8" rx="4" fill="#bfdbfe"/>
  <rect x="250" y="561" width="220" height="8" rx="4" fill="#bfdbfe"/>

  <g transform="translate(690 170)">
    <rect width="490" height="620" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="245" cy="66" r="34" fill="#dbeafe"/>
    <path d="M245 43c-15 0-27 12-27 27s12 27 27 27 27-12 27-27-12-27-27-27zm0 91c-38 0-69 19-69 43h138c0-24-31-43-69-43z" fill="#2563eb"/>
    <text x="245" y="200" text-anchor="middle" class="sans azul bold" font-size="34">Iniciar sesión</text>
    <text x="245" y="232" text-anchor="middle" class="sans muted" font-size="18">Accede a tu agenda local</text>

    <text x="55" y="286" class="sans azul bold" font-size="16">Usuario o correo</text>
    <rect x="55" y="300" width="380" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="75" y="333" class="sans muted" font-size="17">Escribe tu usuario</text>

    <text x="55" y="390" class="sans azul bold" font-size="16">Contraseña</text>
    <rect x="55" y="404" width="380" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="75" y="437" class="sans muted" font-size="17">Escribe tu contraseña</text>
    <text x="55" y="486" class="sans muted" font-size="15">¿Olvidaste tu contraseña?</text>

    <rect x="55" y="510" width="380" height="56" rx="9" fill="#2563eb"/>
    <text x="245" y="546" text-anchor="middle" class="sans white bold" font-size="19">Ingresar</text>
    <text x="245" y="590" text-anchor="middle" class="sans muted" font-size="16">¿No tienes una cuenta? <tspan fill="#2563eb" font-weight="700">Registrarte</tspan></text>
  </g>
</svg>
