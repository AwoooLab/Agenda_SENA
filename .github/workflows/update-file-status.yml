name: Update file status

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/file_status.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate file status
        run: python scripts/generate_file_status.py

      - name: Commit updated status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/file_status.md

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Update file status"
            git push
          fi
